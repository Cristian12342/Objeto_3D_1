<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Wheels 3D Showcase</title>

  <!-- Enlace al archivo CSS externo -->
  <link rel="stylesheet" href="styles.css">

  <!-- Script oficial para renderizar modelos 3D -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <div class="card-container">
    <div class="header">
      <h1>Hot Wheels 3D</h1>
      <p>Arrastra para rotar | Haz zoom con la rueda del ratón</p>
    </div>

    <div class="viewer-box">
    
      <model-viewer 
        src="gmc_k-2500/scene.gltf" 
        alt="Hot Wheels 3D Model" 
        auto-rotate 
        camera-controls 
        shadow-intensity="1.5"
        shadow-softness="1"
        exposure="1.2"
        environment-image="neutral">
      </model-viewer>
    </div>

    <div class="footer-info">
      <span class="badge">INTERACTIVO</span>
      <span>Compatible con controles táctiles y ratón</span>
    </div>
  </div>

</body>
</html>
